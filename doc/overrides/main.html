{% extends "base.html" %}

{% block extrahead %}
  <!-- Primary Meta Tags -->
  <meta name="title" content="{% if page.title %}{{ page.title }} - {% endif %}Rite - Modern Python Utility Library">
  <meta name="description" content="{% if page.meta.description %}{{ page.meta.description }}{% else %}Zero-dependency Python utility library for Python 3.10+. Features cryptography, filesystem, text processing, temporal operations, and more.{% endif %}">
  <meta name="keywords" content="python, utility library, cryptography, filesystem, text processing, python utilities, python 3.10, zero dependencies, rite, {{ page.meta.keywords|default('') }}">
  <meta name="author" content="Scape Agency">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">
  <meta name="revisit-after" content="7 days">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}Rite">
  <meta property="og:description" content="{% if page.meta.description %}{{ page.meta.description }}{% else %}Zero-dependency Python utility library for Python 3.10+{% endif %}">
  <meta property="og:image" content="{{ config.site_url }}assets/image/rite_social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Rite">
  <meta property="og:locale" content="en_US">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ page.canonical_url }}">
  <meta property="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}Rite">
  <meta property="twitter:description" content="{% if page.meta.description %}{{ page.meta.description }}{% else %}Zero-dependency Python utility library for Python 3.10+{% endif %}">
  <meta property="twitter:image" content="{{ config.site_url }}assets/image/rite_social.png">

  <!-- Additional SEO -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rite">
  <meta name="theme-color" content="#2196f3">
  <link rel="canonical" href="{{ page.canonical_url }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{% if page.is_homepage %}WebSite{% else %}WebPage{% endif %}",
    "name": "{% if page.title %}{{ page.title }}{% else %}Rite{% endif %}",
    "description": "{% if page.meta.description %}{{ page.meta.description }}{% else %}Modern Python utility library with zero runtime dependencies{% endif %}",
    "url": "{{ page.canonical_url }}",
    {% if page.is_homepage %}
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ config.site_url }}?q={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    {% endif %}
    "publisher": {
      "@type": "Organization",
      "name": "Scape Agency",
      "url": "https://www.scape.agency",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ config.site_url }}assets/image/rite_logo_light.svg"
      }
    },
    "inLanguage": "en-US",
    "datePublished": "2023-01-01",
    "dateModified": "{{ build_date_utc.strftime('%Y-%m-%d') }}"
  }
  </script>
{% endblock %}

{% block announce %}
  <!-- Custom announcement bar can go here -->
  {{ super() }}
{% endblock %}
