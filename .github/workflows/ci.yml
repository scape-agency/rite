name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Add Poetry to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $poetryPath = "$env:APPDATA\Python\Scripts"
        if (Test-Path $poetryPath) {
          echo "$poetryPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        $poetryPath2 = "$env:USERPROFILE\.local\bin"
        if (Test-Path $poetryPath2) {
          echo "$poetryPath2" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: poetry install --no-interaction --no-root

    - name: Install project
      shell: bash
      run: poetry install --no-interaction

    - name: Run tests with coverage
      shell: bash
      run: |
        poetry run pytest --cov=rite --cov-report=xml --cov-report=term-missing tst/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run flake8
      run: poetry run flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Run black check
      run: poetry run black --check src/

    - name: Run isort check
      run: poetry run isort --check-only --profile black src/

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run mypy
      run: poetry run mypy src/rite --ignore-missing-imports
      continue-on-error: true  # Allow to pass initially due to existing issues
